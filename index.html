<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Totem - INTEG 4K</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

  <!-- Overlay de toque inicial -->
  <div id="start-overlay">
    Toque em qualquer lugar para iniciar o Totem
  </div>

  <!-- Botão Secreto para alternar Fullscreen -->
  <button id="exit-fullscreen-btn" title="Atalho de Tela Cheia"></button>

  <div class="container">

    <!-- Logo Superior -->
    <div class="logo-area">
      <div class="logo-circle">
        <img src="images/logo_integ.png" alt="INTEG Logo">
      </div>
    </div>

    <!-- Título Principal -->
    <div class="title-area">
      <h1>Incubadora Tecnológica<br>de Guarapuava</h1>
      <p>UNICENTRO</p>
    </div>

    <!-- Botão do Quiz -->
    <button class="btn-quiz" id="startBtn">Iniciar o Quiz</button>

    <!-- Seção de Carrosséis -->
    <div class="partners-section">
      
      <!-- CARROSSEL 1: EMPRESAS INCUBADAS -->
      <div class="partners-title">EMPRESAS INCUBADAS</div>
      <div class="carousel-container">
        <div class="carousel-track track-left">
          <!-- Bloco Original (14 Logos) -->
          <div class="partner-card"><img src="images/citom.png" alt="Logo 1"></div>
          <div class="partner-card"><img src="images/educador.png" alt="Logo 2"></div>
          <div class="partner-card"><img src="images/genoBit.png" alt="Logo 3"></div>
          <div class="partner-card"><img src="images/hydroBrasil.png" alt="Logo 4"></div>
          <div class="partner-card"><img src="images/miceliar.png" alt="Logo 5"></div>
          <div class="partner-card"><img src="logo_integ/palicare.png" alt="Logo 6"></div>
          <div class="partner-card"><img src="images/zaaier.png" alt="Logo 7"></div>
          <div class="partner-card"><img src="images/incluir.png" alt="Logo 8"></div>
          <div class="partner-card"><img src="images/nano.png" alt="Logo 9"></div>
          <div class="partner-card"><img src="images/prospecta.png" alt="Logo 10"></div>
          <div class="partner-card"><img src="images/verde_serra.png" alt="Logo 11"></div>
          <div class="partner-card"><img src="images/b2farm.png" alt="Logo 12"></div>
          <div class="partner-card"><img src="images/kartech.png" alt="Logo 13"></div>
          <div class="partner-card"><img src="images/expertin.png" alt="Logo 14"></div>

          <!-- Bloco Duplicado (Para Loop Infinito sem Saltos) -->
          <div class="partner-card"><img src="images/citom.png" alt="Logo 1"></div>
          <div class="partner-card"><img src="images/educador.png" alt="Logo 2"></div>
          <div class="partner-card"><img src="images/genoBit.png" alt="Logo 3"></div>
          <div class="partner-card"><img src="images/hydroBrasil.png" alt="Logo 4"></div>
          <div class="partner-card"><img src="images/miceliar.png" alt="Logo 5"></div>
          <div class="partner-card"><img src="logo_integ/palicare.png" alt="Logo 6"></div>
          <div class="partner-card"><img src="images/zaaier.png" alt="Logo 7"></div>
          <div class="partner-card"><img src="images/incluir.png" alt="Logo 8"></div>
          <div class="partner-card"><img src="images/nano.png" alt="Logo 9"></div>
          <div class="partner-card"><img src="images/prospecta.png" alt="Logo 10"></div>
          <div class="partner-card"><img src="images/verde_serra.png" alt="Logo 11"></div>
          <div class="partner-card"><img src="images/b2farm.png" alt="Logo 12"></div>
          <div class="partner-card"><img src="images/kartech.png" alt="Logo 13"></div>
          <div class="partner-card"><img src="images/expertin.png" alt="Logo 14"></div>
        </div>
      </div>

      <!-- CARROSSEL 2: EMPRESAS GRADUADAS -->
      <div class="partners-title">EMPRESAS GRADUADAS</div>
      <div class="carousel-container">
        <div class="carousel-track track-right">
          <!-- Bloco Original (15 Logos) -->
          <div class="partner-card"><img src="images/exatamente.png" alt="Logo 15"></div>
          <div class="partner-card"><img src="images/tecnoquisa.png" alt="Logo 16"></div>
          <div class="partner-card"><img src="images/aluminnium.png" alt="Logo 17"></div>
          <div class="partner-card"><img src="images/klara.png" alt="Logo 18"></div>
          <div class="partner-card"><img src="images/citrodora.png" alt="Logo 19"></div>
          <div class="partner-card"><img src="images/sace.png" alt="Logo 20"></div>
          <div class="partner-card"><img src="images/lumabio.png" alt="Logo 21"></div>
          <div class="partner-card"><img src="images/organic.png" alt="Logo 22"></div>
          <div class="partner-card"><img src="images/honeyglass.png" alt="Logo 23"></div>
          <div class="partner-card"><img src="images/umporum.png" alt="Logo 24"></div>
          <div class="partner-card"><img src="images/terra_amazonica.png" alt="Logo 25"></div>
          <div class="partner-card"><img src="images/enfermatech.png" alt="Logo 26"></div>
          <div class="partner-card"><img src="images/aepapa.png" alt="Logo 27"></div>
          <div class="partner-card"><img src="images/sec4us.png" alt="Logo 28"></div>
          <div class="partner-card"><img src="images/idea.png" alt="Logo 29"></div>

          <!-- Bloco Duplicado (Para Loop Infinito sem Saltos) -->
          <div class="partner-card"><img src="images/exatamente.png" alt="Logo 15"></div>
          <div class="partner-card"><img src="images/tecnoquisa.png" alt="Logo 16"></div>
          <div class="partner-card"><img src="images/aluminnium.png" alt="Logo 17"></div>
          <div class="partner-card"><img src="images/klara.png" alt="Logo 18"></div>
          <div class="partner-card"><img src="images/citrodora.png" alt="Logo 19"></div>
          <div class="partner-card"><img src="images/sace.png" alt="Logo 20"></div>
          <div class="partner-card"><img src="images/lumabio.png" alt="Logo 21"></div>
          <div class="partner-card"><img src="images/organic.png" alt="Logo 22"></div>
          <div class="partner-card"><img src="images/honeyglass.png" alt="Logo 23"></div>
          <div class="partner-card"><img src="images/umporum.png" alt="Logo 24"></div>
          <div class="partner-card"><img src="images/terra_amazonica.png" alt="Logo 25"></div>
          <div class="partner-card"><img src="images/enfermatech.png" alt="Logo 26"></div>
          <div class="partner-card"><img src="images/aepapa.png" alt="Logo 27"></div>
          <div class="partner-card"><img src="images/sec4us.png" alt="Logo 28"></div>
          <div class="partner-card"><img src="images/idea.png" alt="Logo 29"></div>
        </div>
      </div>

    </div>

  </div>

  <script src="script.js"></script>
</body>

</html>
