<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Totem - INTEG</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Tela inicial obrigatória para ativar Fullscreen pelo toque -->
  <div id="start-overlay">
    Toque em qualquer lugar para iniciar o Totem
  </div>

  <!-- Botão Secreto no Canto Superior Direito -->
  <button id="exit-fullscreen-btn" title="Atalho Secreto de Tela Cheia"></button>

  <div class="container">
    
    <div class="logo-area">
      <div class="logo-circle">
        <img src="logo-integ.png" alt="INTEG Logo" style="width: 80%;">
      </div>
    </div>

    <div class="title-area">
      <h1>Incubadora Tecnológica<br>de Guarapuava</h1>
      <p>UNICENTRO</p>
    </div>

    <button class="btn-quiz" id="startBtn">Iniciar o Quiz</button>

    <div class="partners-section">
      <div class="partners-title">EMPRESAS PARCEIRAS</div>
      
      <div class="carousel-container">
        <div class="carousel-track track-left">
          <div class="partner-card"><img src="logo1.png" alt="1" style="width: 80%;"></div>
          <div class="partner-card"><img src="logo2.png" alt="2" style="width: 80%;"></div>
          <div class="partner-card"><img src="logo3.png" alt="3" style="width: 80%;"></div>
          <div class="partner-card"><img src="logo4.png" alt="4" style="width: 80%;"></div>
          <!-- Duplicados -->
          <div class="partner-card"><img src="logo1.png" alt="1" style="width: 80%;"></div>
          <div class="partner-card"><img src="logo2.png" alt="2" style="width: 80%;"></div>
          <div class="partner-card"><img src="logo3.png" alt="3" style="width: 80%;"></div>
          <div class="partner-card"><img src="logo4.png" alt="4" style="width: 80%;"></div>
        </div>
      </div>

      <div class="carousel-container">
        <div class="carousel-track track-right">
          <div class="partner-card"><img src="logo5.png" alt="5" style="width: 80%;"></div>
          <div class="partner-card"><img src="logo6.png" alt="6" style="width: 80%;"></div>
          <div class="partner-card"><img src="logo7.png" alt="7" style="width: 80%;"></div>
          <div class="partner-card"><img src="logo8.png" alt="8" style="width: 80%;"></div>
          <!-- Duplicados -->
          <div class="partner-card"><img src="logo5.png" alt="5" style="width: 80%;"></div>
          <div class="partner-card"><img src="logo6.png" alt="6" style="width: 80%;"></div>
          <div class="partner-card"><img src="logo7.png" alt="7" style="width: 80%;"></div>
          <div class="partner-card"><img src="logo8.png" alt="8" style="width: 80%;"></div>
        </div>
      </div>

    </div>

  </div>

  <script>
    
    const overlay = document.getElementById('start-overlay');
    const exitBtn = document.getElementById('exit-fullscreen-btn');

    // Função para entrar em Tela Cheia
    function requestFullscreen() {
      const elem = document.documentElement;
      if (elem.requestFullscreen) {
        elem.requestFullscreen();
      } else if (elem.webkitRequestFullscreen) {
        elem.webkitRequestFullscreen();
      } else if (elem.msRequestFullscreen) {
        elem.msRequestFullscreen();
      }
    }

    // Função para sair da Tela Cheia
    function exitFullscreen() {
      if (document.exitFullscreen) {
        document.exitFullscreen();
      } else if (document.webkitExitFullscreen) {
        document.webkitExitFullscreen();
      } else if (document.msExitFullscreen) {
        document.msExitFullscreen();
      }
    }

    // Ao dar o primeiro toque no Totem, entra em tela cheia e esconde o overlay
    overlay.addEventListener('click', () => {
      requestFullscreen();
      overlay.style.display = 'none';
    });

    // Clique no canto superior direito alterna a tela cheia
    exitBtn.addEventListener('click', () => {
      if (!document.fullscreenElement && !document.webkitFullscreenElement) {
        requestFullscreen();
      } else {
        exitFullscreen();
      }
    });
  </script>

</body>
</html>
