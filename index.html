<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Totem - INTEG 4K</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Overlay de toque inicial -->
  <div id="start-overlay">
    Toque em qualquer lugar para iniciar o Totem
  </div>

  <!-- Botão Secreto para alternar Fullscreen -->
  <button id="exit-fullscreen-btn" title="Atalho de Tela Cheia"></button>

  <div class="container">
    
    <!-- Logo Superior -->
    <div class="logo-area">
      <div class="logo-circle">
        <img src="images/logo_integ.png" alt="INTEG Logo">
      </div>
    </div>

    <!-- Título Principal -->
    <div class="title-area">
      <h1>Incubadora Tecnológica<br>de Guarapuava</h1>
      <p>UNICENTRO</p>
    </div>

    <!-- Botão do Quiz -->
    <button class="btn-quiz" id="startBtn">Iniciar o Quiz</button>

    <!-- Carrosséis de Logos -->
    <div class="partners-section">
      <div class="partners-title">EMPRESAS PARCEIRAS</div>
      
      <!-- Carrossel 1: Direita para Esquerda -->
      <div class="carousel-container">
        <div class="carousel-track track-left">
          <div class="partner-card"><img src="images/citom.png" alt="Logo 1"></div>
          <div class="partner-card"><img src="images/educador.png" alt="Logo 2"></div>
          <div class="partner-card"><img src="images/genoBit.png" alt="Logo 3"></div>
          <div class="partner-card"><img src="images/hydroBrasil.png" alt="Logo 4"></div>

          <div class="partner-card"><img src="images/miceliar.png" alt="Logo 1"></div>
          <div class="partner-card"><img src="images/palicare.png" alt="Logo 2"></div>
          <div class="partner-card"><img src="logo3.png" alt="Logo 3"></div>
          <div class="partner-card"><img src="logo4.png" alt="Logo 4"></div>

          <div class="partner-card"><img src="logo1.png" alt="Logo 1"></div>
          <div class="partner-card"><img src="logo2.png" alt="Logo 2"></div>
          <div class="partner-card"><img src="logo3.png" alt="Logo 3"></div>
          <div class="partner-card"><img src="logo4.png" alt="Logo 4"></div>
        </div>
      </div>

      <!-- Carrossel 2: Esquerda para Direita -->
      <div class="carousel-container">
        <div class="carousel-track track-right">
          <div class="partner-card"><img src="logo5.png" alt="Logo 5"></div>
          <div class="partner-card"><img src="logo6.png" alt="Logo 6"></div>
          <div class="partner-card"><img src="logo7.png" alt="Logo 7"></div>
          <div class="partner-card"><img src="logo8.png" alt="Logo 8"></div>

          <div class="partner-card"><img src="logo5.png" alt="Logo 5"></div>
          <div class="partner-card"><img src="logo6.png" alt="Logo 6"></div>
          <div class="partner-card"><img src="logo7.png" alt="Logo 7"></div>
          <div class="partner-card"><img src="logo8.png" alt="Logo 8"></div>

          <div class="partner-card"><img src="logo5.png" alt="Logo 5"></div>
          <div class="partner-card"><img src="logo6.png" alt="Logo 6"></div>
          <div class="partner-card"><img src="logo7.png" alt="Logo 7"></div>
          <div class="partner-card"><img src="logo8.png" alt="Logo 8"></div>
        </div>
      </div>

    </div>

  </div>

  <script src="script.js"></script>
</body>
</html>
