<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Resultado do Quiz INTEG</title>
    <link rel="stylesheet" href="../css/resultPage.css">
</head>
<body>
    <button id="exit-fullscreen-btn" title="Atalho de Tela Cheia"></button>

    <div class="logo-area">
        <div class="logo-circle">
            <img src="../assets/images/logo_integ.png" alt="INTEG Logo" class="logo-image">
        </div>
    </div>

    <main class="result-container">
        <h1 class="result-title">Quiz concluído!!</h1>
        <p class="result-text"></p>

        <div class="next-button-container">
            <button class="next-button" type="button">RECOMEÇAR QUIZ</button>
        </div>

        <div class="exit-area">
            <button class="exit-text" type="button">Sair do Quiz</button>
        </div>
    </main>

    <script src="../js/resultPage.js"></script>
</body>
</html>
