<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quiz INTEG</title>
    <link rel="stylesheet" href="../css/quizPage.css">
</head>
<body>
    <button id="exit-fullscreen-btn" title="Atalho de Tela Cheia"></button>
    <div class="logo-area">
        <div class="logo-circle">
            <img src="../assets/images/logo_integ.png" alt="INTEG Logo" class="logo-image">
        </div>
    </div>
    <div class="quiz-container">
        <div class="Title">
            <div class="num-question"></div>
            <div class="question-text"></div>
        </div>
        <div class="question-container"></div>
        
        <div class="next-button-container">
            <button class="next-button" type="button">PRÓXIMA PERGUNTA</button>
        </div>
        <div class="exit-area">
            <button class="exit-text">Sair do Quiz</button>
        </div>
    </div>
    <script src="../js/perguntasQuiz.js"></script>
    <script src="../js/index.js"></script>
    <script src="../js/quizPage.js"></script>
</body>
</html>
